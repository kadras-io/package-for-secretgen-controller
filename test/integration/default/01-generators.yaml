# Password
---
apiVersion: secretgen.k14s.io/v1alpha1
kind: Password
metadata:
  name: password-test
spec:
  length: 32
  digits: 4
  secretTemplate:
    type: Opaque
    stringData:
      username: admin
      password: $(value)

# RSA Key
---
apiVersion: secretgen.k14s.io/v1alpha1
kind: RSAKey
metadata:
  name: rsa-key-test
spec: {}

# SSH Key
---
apiVersion: secretgen.k14s.io/v1alpha1
kind: SSHKey
metadata:
  name: ssh-key-test
spec: {}

# Certificates: a root CA signing a leaf certificate, stored as a TLS Secret
---
apiVersion: secretgen.k14s.io/v1alpha1
kind: Certificate
metadata:
  name: root-ca-test
spec:
  isCA: true
---
apiVersion: secretgen.k14s.io/v1alpha1
kind: Certificate
metadata:
  name: certificate-test
spec:
  caRef:
    name: root-ca-test
  alternativeNames:
    - test.kadras.io
  secretTemplate:
    type: kubernetes.io/tls
    stringData:
      tls.crt: $(certificate)
      tls.key: $(privateKey)
---
# Users with the `edit` and `view` roles in the namespace, to check the permissions added to the default roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: viewer
