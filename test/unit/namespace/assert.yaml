apiVersion: v1
kind: Namespace
metadata:
  name: secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretgen-controller
  namespace: secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secretgen-controller-sa
  namespace: secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secretgen-controller-cluster-role-binding
subjects:
- kind: ServiceAccount
  name: secretgen-controller-sa
  namespace: secrets
