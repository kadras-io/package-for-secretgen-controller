#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#! secretgen-controller runs in the package namespace. It watches the resources in all the namespaces,
#! so the namespace doesn't affect where Secrets can be generated or shared.

#@ namespace = data.values.namespace

#@overlay/match by=overlay.subset({"kind":"Namespace", "metadata":{"name":"secretgen-controller"}})
---
metadata:
  name: #@ namespace

#@overlay/match by=overlay.subset({"metadata":{"namespace":"secretgen-controller"}}), expects="2+"
---
metadata:
  namespace: #@ namespace

#@overlay/match by=overlay.subset({"kind":"ClusterRoleBinding"}), expects="1+"
---
subjects:
#@overlay/match by=overlay.subset({"kind":"ServiceAccount"})
- namespace: #@ namespace
